<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Cart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="cart-page">
<div th:if="${toastMessage}" id="toast" th:class="'toast-popup toast-' + ${toastType}" th:text="${toastMessage}"></div>

<header class="top-nav" style="max-width:1080px;margin:0 auto;background:transparent;border:0;">
    <div class="top-nav-left">
        <a href="/store" style="text-decoration:none;font-size:1.25rem;">←</a>
        <h2>Shopping Cart</h2>
    </div>
    <div class="nav-actions">
        <div th:if="${user != null}" class="user-badge-header">
            <span>👤</span>
            <span th:text="${user.userName}">User</span>
        </div>
        <a href="/store" class="btn btn-primary">Continue Shopping</a>
        <a href="/logout" class="btn btn-delete">Logout</a>
    </div>

</header>


<main class="cart-shell">
    <div th:if="${#lists.isEmpty(cartItems)}" class="cart-card" style="padding:70px 30px;text-align:center;">
        <div style="font-size:3rem;margin-bottom:12px;">🛒</div>
        <h3 style="color:#111827;">Your cart is empty</h3>
        <p style="color:#64748b;margin:8px 0 20px;">Add some products from the marketplace.</p>
        <a href="/store" class="btn btn-primary">Browse Products</a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}">
        <div class="cart-card">
            <table class="data-table" style="min-width:720px;">
                <thead>
                <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td>
                        <div style="display:flex;align-items:center;gap:13px;">
                            <img class="cart-item-image"
                                 th:src="@{'/images/' + ${item.product.imageName != null && !item.product.imageName.empty ? item.product.imageName : 'balancing_toner.jpg'}}"
                                 alt="Product">
                            <div>
                                <strong style="display:block;color:#111827;" th:text="${item.product.name}">Product</strong>
                                <span style="font-size:.78rem;color:#94a3b8;" th:text="${'ID #' + item.product.id}">ID #0</span>
                            </div>
                        </div>
                    </td>
                    <td style="font-weight:700;" th:text="${'$' + item.product.price}">$0.00</td>
                    <td>
                        <form action="/cart/update" method="POST" class="qty-control">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <input type="hidden" class="qty-input" name="quantity" th:value="${item.quantity}">
                            <button type="submit" name="action" value="decrease" aria-label="Decrease quantity">−</button>
                            <span class="qty-value" th:text="${item.quantity}">1</span>
                            <button type="submit" name="action" value="increase" aria-label="Increase quantity">+</button>
                        </form>
                    </td>
                    <td style="font-weight:900;color:#111827;" th:text="${'$' + item.subtotal}">$0.00</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="cart-summary">
            <div style="text-align:right;">
                <span style="display:block;color:#64748b;font-size:.82rem;font-weight:700;">TOTAL</span>
                <span class="total-value" th:text="${'$' + total}">$0.00</span>
            </div>
            <form action="/cart/buy" method="POST">
                <button type="submit" class="btn btn-add" style="padding:14px 22px;font-size:.95rem;">Checkout →</button>
            </form>
        </div>
    </div>
</main>
<script th:src="@{/js/cart.js}" src="/js/cart.js"></script>
</body>
</html>
