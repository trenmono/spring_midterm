<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marketplace</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* =========================================================
           RESET
        ========================================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }


        /* =========================================================
           MARKETPLACE
        ========================================================= */
        .marketplace-page {
            width: 100%;
            height: 100vh;
        }

        .marketplace-shell {
            width: 100%;
            max-width: 1400px;

            height: calc(100vh - 65px);

            margin: 0 auto;
            padding: 0 16px 16px;

            display: flex;
            flex-direction: column;

            min-height: 0;
        }


        /* =========================================================
           HEADER
        ========================================================= */
        .marketplace-header {
            width: 100%;
            max-width: 1320px;

            height: 65px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            flex-shrink: 0;
        }

        .top-nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-nav-left h2 {
            margin: 0;

            color: #111827;

            font-size: 1.25rem;
            font-weight: 800;
        }

        .brand-dot {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: #4f46e5;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            padding: 9px 14px;

            color: #334155;

            text-decoration: none;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 9px;

            font-size: 0.875rem;
            font-weight: 700;

            transition: 0.2s ease;
        }

        .cart-link:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }


        /* =========================================================
           FILTER BAR
        ========================================================= */
        .filter-bar {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 16px;
            padding: 12px 16px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 12px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

            flex-shrink: 0;
        }

        .search-wrapper {
            flex: 1;
            min-width: 0;
        }

        .search-input,
        .category-select {
            width: 100%;

            padding: 9px 13px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            outline: none;

            background: #ffffff;

            color: #111827;

            font-size: 0.875rem;

            transition: 0.2s ease;
        }

        .search-input:focus,
        .category-select:focus {
            border-color: #6366f1;

            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .category-wrapper {
            width: 180px;
            flex-shrink: 0;
        }

        .category-select {
            cursor: pointer;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */
        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            border: 0;

            text-decoration: none;

            cursor: pointer;

            font-size: 0.875rem;
            font-weight: 700;

            transition:
                    background 0.2s ease,
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
        }

        .btn-primary {
            padding: 9px 18px;

            color: #ffffff;

            background: #4f46e5;

            border-radius: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #4338ca;

            transform: translateY(-1px);

            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:disabled {
            cursor: not-allowed;

            background: #cbd5e1;

            color: #64748b;
        }

        .btn-clear {
            padding: 9px 14px;

            color: #64748b;

            background: #f1f5f9;

            border-radius: 8px;
        }

        .btn-clear:hover {
            background: #e2e8f0;
        }

        .btn-delete {
            padding: 9px 14px;

            color: #ffffff;

            background: #ef4444;

            border-radius: 8px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }


        /* =========================================================
           PRODUCT GRID
        ========================================================= */
        .store-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            column-gap: 20px;
            row-gap: 24px;

            flex: 1 1 auto;

            min-height: 0;

            padding:
                    8px
                    8px
                    32px
                    8px;

            overflow-y: auto;
            overflow-x: hidden;

            align-content: start;
            align-items: stretch;
        }

        /* Scrollbar */
        .store-grid::-webkit-scrollbar {
            width: 8px;
        }

        .store-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .store-grid::-webkit-scrollbar-thumb {
            background: #cbd5e1;

            border-radius: 20px;
        }

        .store-grid::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }


        /* =========================================================
           PRODUCT CARD
        ========================================================= */
        .product-card {
            width: 100%;
            min-width: 0;

            min-height: 430px;

            padding: 16px;

            display: flex;
            flex-direction: column;

            justify-content: space-between;

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                    0 2px 5px rgba(15, 23, 42, 0.04);

            transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease,
                    border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);

            border-color: #c7d2fe;

            box-shadow:
                    0 10px 24px rgba(15, 23, 42, 0.08);
        }


        /* =========================================================
           PRODUCT CONTENT
        ========================================================= */
        .product-content {
            width: 100%;
            min-width: 0;
        }


        /* =========================================================
           PRODUCT IMAGE
        ========================================================= */
        .product-image {
            width: 100%;
            height: 200px;

            margin-bottom: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                    linear-gradient(
                            145deg,
                            #f8fafc,
                            #eef2ff
                    );

            border-radius: 12px;
        }

        .product-image img {
            display: block;

            width: 100%;
            height: 100%;

            padding: 12px;

            object-fit: contain;

            transition: transform 0.25s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.04);
        }


        /* =========================================================
           PRODUCT INFO
        ========================================================= */
        .product-info {
            width: 100%;
            min-width: 0;
        }

        .product-title-row {
            width: 100%;

            display: flex;

            align-items: flex-start;
            justify-content: space-between;

            gap: 8px;
        }

        .product-title {
            flex: 1;
            min-width: 0;

            margin: 0;

            color: #111827;

            font-size: 0.95rem;
            font-weight: 800;

            line-height: 1.4;

            overflow: hidden;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }


        /* =========================================================
           STOCK BADGE
        ========================================================= */
        .stock-badge {
            flex-shrink: 0;

            padding: 4px 7px;

            background: #eef2ff;

            color: #4f46e5;

            border-radius: 6px;

            font-size: 0.68rem;

            font-weight: 800;

            white-space: nowrap;
        }

        .stock-badge.sold-out {
            background: #fef2f2;
            color: #dc2626;
        }


        /* =========================================================
           PRICE
        ========================================================= */
        .product-price {
            margin: 9px 0 2px;

            color: #4f46e5;

            font-size: 1.2rem;

            font-weight: 900;

            line-height: 1.2;
        }

        .product-quantity {
            margin: 0;

            color: #94a3b8;

            font-size: 0.78rem;
        }


        /* =========================================================
           CART FORM
        ========================================================= */
        .cart-form {
            width: 100%;

            margin-top: 16px;

            flex-shrink: 0;
        }

        .cart-form button {
            width: 100%;

            min-height: 44px;

            padding: 11px 12px;

            border-radius: 8px;
        }


        /* =========================================================
           TOAST
        ========================================================= */
        .toast-popup {
            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 9999;

            padding: 12px 18px;

            border-radius: 10px;

            color: #ffffff;

            background: #111827;

            box-shadow:
                    0 10px 30px rgba(0, 0, 0, 0.15);

            font-size: 0.875rem;

            font-weight: 600;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        /* 1200px */
        @media (max-width: 1200px) {

            .store-grid {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }
        }


        /* 1000px */
        @media (max-width: 1000px) {

            .store-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }


        /* 750px */
        @media (max-width: 750px) {

            .filter-bar {
                flex-wrap: wrap;
            }

            .search-wrapper {
                width: 100%;
                flex-basis: 100%;
            }

            .category-wrapper {
                flex: 1;
                width: auto;
            }

            .store-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                column-gap: 14px;
                row-gap: 18px;
            }

            .product-card {
                min-height: 410px;
                padding: 13px;
            }

            .product-image {
                height: 170px;
            }
        }


        /* 500px */
        @media (max-width: 500px) {

            .marketplace-shell {
                padding-left: 10px;
                padding-right: 10px;
            }

            .marketplace-header {
                height: 60px;
            }

            .nav-actions {
                gap: 5px;
            }

            .cart-link {
                padding: 8px 10px;
            }

            .btn-delete {
                padding: 8px 10px;
            }

            .store-grid {
                grid-template-columns: 1fr;

                row-gap: 16px;
            }

            .product-card {
                min-height: 400px;
            }

            .product-image {
                height: 200px;
            }
        }
    </style>
</head>


<body class="marketplace-page">


<!-- =========================================================
     TOAST
========================================================= -->
<div
        th:if="${toastMessage}"
        id="toast"
        th:class="'toast-popup toast-' + ${toastType}"
        th:text="${toastMessage}">
</div>


<!-- =========================================================
     HEADER
========================================================= -->
<header class="marketplace-header">

    <div class="top-nav-left">

        <div class="brand-dot"></div>

        <h2>Marketplace</h2>

    </div>


    <div class="nav-actions">

        <a href="/cart" class="cart-link">
            🛒 Cart
            <span>
                (<span th:text="${cartCount}">0</span>)
            </span>
        </a>

        <a href="/logout" class="btn btn-delete">
            Logout
        </a>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->
<main class="marketplace-shell">


    <!-- =====================================================
         FILTER BAR
    ====================================================== -->
    <form
            action="/store"
            method="GET"
            class="filter-bar">


        <!-- Search -->
        <div class="search-wrapper">

            <input
                    type="text"
                    name="search"
                    th:value="${search}"
                    placeholder="Search products..."
                    class="search-input">

        </div>


        <!-- Category -->
        <div class="category-wrapper">

            <select
                    name="categoryId"
                    class="category-select"
                    onchange="this.form.submit()">

                <option value="">
                    All Categories
                </option>

                <option
                        th:each="cat : ${categories}"
                        th:value="${cat.catId}"
                        th:text="${cat.categoryName}"
                        th:selected="${categoryId == cat.catId}">
                </option>

            </select>

        </div>


        <!-- Search Button -->
        <button
                type="submit"
                class="btn btn-primary">

            Search

        </button>


        <!-- Clear -->
        <a
                href="/store"
                th:if="${(search != null && !search.empty) || categoryId != null}"
                class="btn btn-clear">

            Clear

        </a>

    </form>



    <!-- =====================================================
         PRODUCT GRID
    ====================================================== -->
    <div class="store-grid">


        <!-- =================================================
             PRODUCT CARD
        ================================================== -->
        <article
                th:each="p : ${products}"
                class="product-card">


            <!-- Product Content -->
            <div class="product-content">


                <!-- Product Image -->
                <div class="product-image">

                    <img
                            th:src="@{'/images/' + ${p.imageName != null && !p.imageName.empty ? p.imageName : 'product_1.png'}}"
                            alt="Product Image">

                </div>



                <!-- Product Info -->
                <div class="product-info">


                    <!-- Title + Stock -->
                    <div class="product-title-row">

                        <h4
                                class="product-title"
                                th:text="${p.name}">

                            Product Name

                        </h4>


                        <span
                                class="stock-badge"
                                th:classappend="${p.quantityNum <= 0 ? ' sold-out' : ''}"
                                th:text="${p.quantityNum > 0 ? 'IN STOCK' : 'SOLD OUT'}">

                            IN STOCK

                        </span>

                    </div>



                    <!-- Price -->
                    <p
                            class="product-price"
                            th:text="${'$' + p.price}">

                        $0.00

                    </p>



                    <!-- Quantity -->
                    <p
                            class="product-quantity"
                            th:text="${p.quantityNum + ' available'}">

                        0 available

                    </p>

                </div>

            </div>



            <!-- =================================================
                 ADD TO CART
            ================================================== -->
            <form
                    action="/cart/add"
                    method="POST"
                    class="cart-form">

                <input
                        type="hidden"
                        name="productId"
                        th:value="${p.id}">


                <button
                        type="submit"
                        class="btn btn-primary"
                        th:disabled="${p.quantityNum <= 0}">

                    <span
                            th:text="${p.quantityNum > 0 ? 'Add to Cart' : 'Out of Stock'}">

                        Add to Cart

                    </span>

                </button>

            </form>

        </article>


    </div>

</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->
<script
        th:src="@{/js/store.js}"
        src="/js/store.js">
</script>


</body>
</html>
