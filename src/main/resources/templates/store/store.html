<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marketplace</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/store.css">
</head>


<body class="marketplace-page">


<!-- =========================================================
     TOAST
========================================================= -->
<div
        th:if="${toastMessage}"
        id="toast"
        th:class="'toast-popup toast-' + ${toastType}"
        th:text="${toastMessage}">
</div>


<!-- =========================================================
     HEADER
========================================================= -->
<header class="marketplace-header">

    <div class="top-nav-left">

        <div class="brand-dot"></div>

        <h2>Marketplace</h2>

    </div>

    <div>
        <div th:if="${user != null}" class="user-badge-center">
            <span>👤</span>
            <span th:text="${user.userName}">User</span>
        </div>
    </div>


    <div class="nav-actions">

        <a th:if="${user != null && 'ADMIN'.equalsIgnoreCase(user.roleName)}" href="/admin/dashboard" class="btn btn-clear">
            Dashboard
        </a>
        <a th:if="${user != null && ('STAFF'.equalsIgnoreCase(user.roleName) || 'STOCK'.equalsIgnoreCase(user.roleName))}" href="/staff/dashboard" class="btn btn-clear">
            Dashboard
        </a>

        <a href="/cart" class="cart-link">
            🛒 Cart
            <span>
                (<span th:text="${cartCount}">0</span>)
            </span>
        </a>

        <a th:if="${user != null}" href="/logout" class="btn btn-delete">
            Logout
        </a>

        <a th:if="${user == null}" href="/login" class="btn btn-primary">
            Login
        </a>

    </div>




</header>



<!-- =========================================================
     MAIN
========================================================= -->
<main class="marketplace-shell">


    <!-- =====================================================
         FILTER BAR
    ====================================================== -->
    <form
            action="/store"
            method="GET"
            class="filter-bar">


        <!-- Search -->
        <div class="search-wrapper">

            <input
                    type="text"
                    name="search"
                    th:value="${search}"
                    placeholder="Search products..."
                    class="search-input">

        </div>


        <!-- Category -->
        <div class="category-wrapper">

            <select
                    name="categoryId"
                    class="category-select"
                    onchange="this.form.submit()">

                <option value="">
                    All Categories
                </option>

                <option
                        th:each="cat : ${categories}"
                        th:value="${cat.catId}"
                        th:text="${cat.categoryName}"
                        th:selected="${categoryId == cat.catId}">
                </option>

            </select>

        </div>


        <!-- Search Button -->
        <button
                type="submit"
                class="btn btn-primary">

            Search

        </button>


        <!-- Clear -->
        <a
                href="/store"
                th:if="${(search != null && !search.empty) || categoryId != null}"
                class="btn btn-clear">

            Clear

        </a>

    </form>



    <!-- =====================================================
         PRODUCT GRID
    ====================================================== -->
    <div class="store-grid">


        <!-- =================================================
             PRODUCT CARD
        ================================================== -->
        <article
                th:each="p : ${products}"
                class="product-card">


            <!-- Product Content -->
            <div class="product-content">


                <!-- Product Image -->
                <div class="product-image">

                    <img
                            th:src="@{'/images/' + ${p.imageName != null && !p.imageName.empty ? p.imageName : 'product_1.png'}}"
                            alt="Product Image">

                </div>



                <!-- Product Info -->
                <div class="product-info">


                    <!-- Title + Stock -->
                    <div class="product-title-row">

                        <h4
                                class="product-title"
                                th:text="${p.name}">

                            Product Name

                        </h4>


                        <span
                                class="stock-badge"
                                th:classappend="${p.quantityNum <= 0 ? ' sold-out' : ''}"
                                th:text="${p.quantityNum > 0 ? 'IN STOCK' : 'SOLD OUT'}">

                            IN STOCK

                        </span>

                    </div>



                    <!-- Price -->
                    <p
                            class="product-price"
                            th:text="${'$' + p.price}">

                        $0.00

                    </p>



                    <!-- Quantity -->
                    <p
                            class="product-quantity"
                            th:text="${p.quantityNum + ' available'}">

                        0 available

                    </p>

                </div>

            </div>



            <!-- =================================================
                 ADD TO CART
            ================================================== -->
            <form
                    action="/cart/add"
                    method="POST"
                    class="cart-form">

                <input
                        type="hidden"
                        name="productId"
                        th:value="${p.id}">


                <button
                        type="submit"
                        class="btn btn-primary"
                        th:disabled="${p.quantityNum <= 0 || (cart != null && cart.containsKey(p.id) && cart.get(p.id) >= p.quantityNum)}">

                    <span
                            th:text="${p.quantityNum <= 0 ? 'Out of Stock' : (cart != null && cart.containsKey(p.id) && cart.get(p.id) >= p.quantityNum ? 'Limit Reached' : 'Add to Cart')}">

                        Add to Cart

                    </span>

                </button>

            </form>

        </article>


    </div>

</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->
<script
        th:src="@{/js/store.js}"
        src="/js/store.js">
</script>


</body>
</html>
