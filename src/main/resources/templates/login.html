<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#0f172a;">

<div th:if="${toastMessage}" id="toast" th:class="'toast-popup toast-' + ${toastType}" th:text="${toastMessage}"></div>

<div style="background:#fff; width:380px; padding:30px; border-radius:10px;">
    <h2 style="text-align:center; margin-bottom:10px;">System Access</h2>
    <div style="display:flex; margin-bottom:20px; border-bottom:2px solid #e2e8f0;">
        <button id="lTab" class="btn" style="flex:1; background:none; color:#3b82f6; font-weight:bold;" onclick="switchTab('login')">Sign In</button>
        <button id="rTab" class="btn" style="flex:1; background:none; color:#64748b;" onclick="switchTab('reg')">Register</button>
    </div>

    <form id="loginForm" action="/login" method="POST">
        <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>

    <form id="regForm" action="/register" method="POST" style="display:none;">
        <div class="form-group"><label>Desired Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-add" style="width:100%;">Create Account</button>
    </form>
</div>

<script th:src="@{/js/login.js}" src="/js/login.js"></script>
</body>
</html>
